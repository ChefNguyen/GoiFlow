name: GoiFlow CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-ci:
    name: Web Frontend CI (Lint, Typecheck, Test, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    env:
      AUTH_SECRET: ci-only-auth-secret-please-do-not-use-in-production
      NEXTAUTH_SECRET: ci-only-auth-secret-please-do-not-use-in-production
      NEXTAUTH_URL: "http://localhost:3000"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      ENABLE_DEV_AUTH: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm run test:unit

      - name: Build Next.js Production Bundle
        run: npm run build
