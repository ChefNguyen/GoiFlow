services:
  postgres:
    image: postgres:16
    container_name: goiflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-goiflow}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - goiflow_net

  redis:
    image: redis:7-alpine
    container_name: goiflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - goiflow_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: goiflow-app
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
    networks:
      - goiflow_net

volumes:
  postgres_data:
  redis_data:

networks:
  goiflow_net:
    driver: bridge
