spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/goiflow}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      max-lifetime: 60000
      idle-timeout: 30000
      keepalive-time: 30000
      validation-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2000ms}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
  cache:
    type: ${CACHE_TYPE:redis}
    redis:
      time-to-live: 86400000
      cache-null-values: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:google-client-id-placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:google-client-secret-placeholder}
            scope: email, profile
          facebook:
            client-id: ${FACEBOOK_APP_ID:facebook-app-id-placeholder}
            client-secret: ${FACEBOOK_APP_SECRET:facebook-app-secret-placeholder}
            scope: email, public_profile

jwt:
  secret: ${AUTH_SECRET:default_jwt_secret_key_please_change_in_production_min_32_chars}
  expiration-ms: 86400000

resend:
  api-key: ${RESEND_API_KEY:resend_api_key_placeholder}
  from: ${EMAIL_FROM:onboarding@resend.dev}

frontend:
  url: ${FRONTEND_URL:http://localhost:3000}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info, readiness
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui/index.html
