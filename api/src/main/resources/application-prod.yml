# =============================================================================
# 🚀 GoiFlow Backend — PRODUCTION CONFIGURATION (application-prod.yml)
# =============================================================================

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://aws-1-ap-northeast-2.pooler.supabase.com:5432/postgres?sslmode=require}
    username: ${DATABASE_USER:postgres.mdmpubffazuutrzvpway}
    password: ${DATABASE_PASSWORD:}
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:google-client-id-placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:google-client-secret-placeholder}
          facebook:
            client-id: ${FACEBOOK_APP_ID:facebook-app-id-placeholder}
            client-secret: ${FACEBOOK_APP_SECRET:facebook-app-secret-placeholder}

app:
  cors:
    allowed-origins:
      - "https://goiflow.vercel.app"
      - "https://*.vercel.app"

logging:
  level:
    com.goiflow: INFO
    org.flywaydb: WARN
